<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>
      Tab 1
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Tab 1</ion-title>
    </ion-toolbar>
  </ion-header>

  <h1 class="counter-value"> {{count}}</h1>
  <p >{{counterName || "noname"}}</p>
  <ion-input [(ngModel)]="counterName" placeholder="název počítadla"></ion-input>
  <ion-button (click)="increment()">+</ion-button> <ion-button (click)="decrement()" [disabled]="count === 0">-</ion-button><ion-button (click)="reset()">reset</ion-button>
  <ion-button  (click)="saveCounter()">Save</ion-button>
</ion-content>
