
<ion-header>
  <ion-toolbar>
    <ion-title>Historie</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">

  <p>Počet záznamů: {{ history.length }}</p>

  <ion-list>
    <ion-item *ngFor="let record of history">
      <ion-label>
        <h2>{{ record.name }}</h2>
        <p>{{ record.date | date:'short' }}</p>
      </ion-label>

      <ion-note slot="end" style="font-size: 30px;">
        {{ record.value }}
      </ion-note>
    </ion-item>
  </ion-list>

</ion-content>
